name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  native:
    concurrency:
      group: moonclaw-ci-${{ github.ref }}-${{ matrix.channel }}
      cancel-in-progress: true
    name: Native (${{ matrix.channel }})
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.channel == 'nightly' }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        channel: [latest, nightly]
    steps:
      - uses: actions/checkout@v5
      - name: Check out declared guide source
        # Historical job fixtures include unmapped gitlinks. Retain them and
        # initialize the actual source dependency declared in .gitmodules.
        run: git submodule update --init --depth=1 -- internal/skills/system/moonbit-agent-guide
      - name: Install MoonBit
        uses: ./.github/actions/install-moonbit
        with:
          channel: ${{ matrix.channel }}
      - name: Inspect toolchain
        run: moon version --all
      - name: Check formatting
        if: matrix.channel == 'latest'
        run: moon fmt --check
      - name: Check native packages
        run: moon check --target native --warn-list +73
      # The native authenticated gateway test executes the real UI tests
      # with --frozen, so resolve that nested module before the native suite.
      - name: Resolve actual gateway UI test dependencies
        working-directory: ui/rabbita-job
        run: moon check --target js
      - name: Test native packages
        run: moon test --target native --warn-list +73
      - name: Verify generated interfaces
        if: matrix.channel == 'nightly'
        run: |
          moon info --target native
          git diff --exit-code -- '*.mbti'
